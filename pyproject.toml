[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-mos-analyzer"
version = "0.1.0"
description = "Mean Opinion Score (MOS) analysis for TTS and AI-dubbing listening tests: confidence intervals, rater screening, bootstrap significance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ansari Adeel Ahmad" }]
keywords = ["mos", "tts", "listening-test", "evaluation", "dubbing", "speech"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
mos = "mos.cli:main"

[project.urls]
Homepage = "https://github.com/ansariadeel-hue/tts-mos-analyzer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
